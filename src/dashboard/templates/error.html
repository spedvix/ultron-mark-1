<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SYSTEM ERROR - ULTRON</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        @keyframes glitch {
            0% { text-shadow: 0 0 10px #ff0000, 0 0 20px #ff0000; }
            25% { text-shadow: 2px 2px 10px #ff0000, -2px -2px 20px #ff0000; }
            50% { text-shadow: -2px 2px 10px #ff0000, 2px -2px 20px #ff0000; }
            75% { text-shadow: 2px -2px 10px #ff0000, -2px 2px 20px #ff0000; }
            100% { text-shadow: 0 0 10px #ff0000, 0 0 20px #ff0000; }
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        
        body {
            font-family: 'Rajdhani', sans-serif;
            background: #0a0e27;
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(255, 0, 0, 0.1) 0%, transparent 50%),
                linear-gradient(180deg, #0a0e27 0%, #1a0a0a 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            color: #ff0000;
        }
        
        .error-container {
            background: linear-gradient(135deg, rgba(10, 14, 39, 0.95) 0%, rgba(26, 10, 10, 0.95) 100%);
            padding: 50px;
            border-radius: 0;
            border: 2px solid #ff0000;
            box-shadow: 
                0 0 50px rgba(255, 0, 0, 0.5),
                inset 0 0 50px rgba(255, 0, 0, 0.1);
            text-align: center;
            max-width: 700px;
            position: relative;
            overflow: hidden;
        }
        
        .error-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 0, 0, 0.2), transparent);
            animation: slide 2s ease-in-out infinite;
        }
        
        @keyframes slide {
            0% { left: -100%; }
            100% { left: 100%; }
        }
        
        h1 {
            font-family: 'Orbitron', sans-serif;
            color: #ff0000;
            font-size: 4em;
            margin-bottom: 20px;
            font-weight: 900;
            letter-spacing: 5px;
            animation: glitch 1s ease-in-out infinite;
        }
        
        .error-code {
            font-family: 'Orbitron', monospace;
            color: #ff0000;
            font-size: 1.3em;
            letter-spacing: 3px;
            margin-bottom: 30px;
            animation: pulse 2s ease-in-out infinite;
        }
        
        p {
            color: rgba(255, 0, 0, 0.8);
            font-size: 1.2em;
            margin-bottom: 30px;
            letter-spacing: 2px;
        }
        
        .error-details {
            background: rgba(255, 0, 0, 0.05);
            padding: 25px;
            border-radius: 0;
            text-align: left;
            color: #ff6666;
            font-family: 'Orbitron', monospace;
            margin: 30px 0;
            border: 1px solid rgba(255, 0, 0, 0.3);
            max-height: 200px;
            overflow-y: auto;
            font-size: 0.9em;
            line-height: 1.6;
        }
        
        .error-details::-webkit-scrollbar {
            width: 8px;
        }
        
        .error-details::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.3);
        }
        
        .error-details::-webkit-scrollbar-thumb {
            background: #ff0000;
            box-shadow: 0 0 10px #ff0000;
        }
        
        a {
            display: inline-block;
            background: linear-gradient(135deg, #ff0000 0%, #ff6666 100%);
            color: #0a0e27;
            padding: 15px 40px;
            border-radius: 0;
            text-decoration: none;
            transition: all 0.3s;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            letter-spacing: 2px;
            border: 2px solid #ff0000;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.5);
        }
        
        a:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.8);
            background: #ff0000;
        }
        
        .status-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            background: #ff0000;
            border-radius: 50%;
            margin-right: 10px;
            animation: pulse 1s ease-in-out infinite;
            box-shadow: 0 0 15px #ff0000;
        }
    </style>
</head>
<body>
    <div class="error-container">
        <h1>⚠ ERROR ⚠</h1>
        <div class="error-code">
            <span class="status-indicator"></span>SYSTEM MALFUNCTION DETECTED
        </div>
        <p>NEURAL INTERFACE COMPROMISED</p>
        <div class="error-details">
            [ ERROR LOG ]<br>
            ------------------------<br>
            {{ error }}<br>
            ------------------------<br>
            [ END ERROR LOG ]
        </div>
        <br>
        <a href="/">← RETURN TO MAIN INTERFACE</a>
        <br><br>
        <p style="font-size: 0.8em; margin-top: 20px; color: rgba(255, 0, 0, 0.5);">
            ULTRON DEFENSE SYSTEM | ERROR PROTOCOL ACTIVE
        </p>
    </div>
    
    <script>
        console.error('%c⚠ SYSTEM ERROR DETECTED ⚠', 'color: #ff0000; font-size: 20px; font-weight: bold;');
        console.error('%cERROR: {{ error }}', 'color: #ff6666; font-size: 14px;');
    </script>
</body>
</html>
